---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@1a3b90a44dd0d1c7c0afdabc52f91e8d4789eb78 # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml

      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/vale@1a3b90a44dd0d1c7c0afdabc52f91e8d4789eb78 # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
