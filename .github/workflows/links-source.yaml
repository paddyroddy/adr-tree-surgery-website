---
name: Link Check Source

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  links:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/links@1a3b90a44dd0d1c7c0afdabc52f91e8d4789eb78 # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lychee-args: --exclude '%7B%7B%20.*?' --no-progress --verbose .
